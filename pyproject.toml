[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "highd-sceneforge"
version = "0.1.0"
description = "Build clean reinforcement-learning scene inputs from the highD dataset and augment traffic density with Gaussian KDE sampling."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "lufyang1" }
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.scripts]
highd-sceneforge = "highd_sceneforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
